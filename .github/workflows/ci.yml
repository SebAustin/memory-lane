name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history secret scan (NFR-13). On push and pull_request the
    # gitleaks action scans only the new commits; this run scans everything.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests with coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Coverage thresholds live in vitest.config.mts (domain, validator, qloo).
      - run: pnpm test:coverage

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks must see the whole history (NFR-13)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle-scan:
    name: Bundle canary scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds with canary secrets, fails if one appears in .next/static/** (SC-11).
      - run: pnpm scan:bundle

  e2e:
    name: Playwright E2E (fixture mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      # next build + next start with QLOO_MODE=fixture LLM_MODE=mock
      # ALLOW_MOCK_LLM=1 RATE_LIMIT_MODE=off (set in playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
